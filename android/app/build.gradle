apply plugin: 'com.android.application'

android {
    namespace "com.motorcare.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.motorcare.app"
        minSdkVersion 23
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('motorcare-release-key.jks')
            storePassword 'MotorCare@2026'
            keyAlias 'motorcare'
            keyPassword 'MotorCare@2026'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// حل مشكلة سحب نسخ الـ JVM بدلاً من نسخ Android
configurations.all {
    resolutionStrategy.eachDependency {
        if (requested.group == "androidx.datastore") {
            if (requested.name == "datastore-preferences-jvm" || requested.name == "datastore-preferences") {
                useTarget("androidx.datastore:datastore-preferences-android:1.1.1")
            }
            if (requested.name == "datastore-core-jvm" || requested.name == "datastore-core") {
                useTarget("androidx.datastore:datastore-core-android:1.1.1")
            }
            if (requested.name == "datastore-jvm" || requested.name == "datastore") {
                useTarget("androidx.datastore:datastore-android:1.1.1")
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // نسخ أندرويد الصريحة لمكتبة DataStore
    implementation "androidx.datastore:datastore-preferences-android:1.1.1"
    implementation "androidx.datastore:datastore-core-android:1.1.1"
    implementation "androidx.datastore:datastore-android:1.1.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    dependencies {
        // Import the BoM for the Firebase platform
        implementation(platform("com.google.firebase:firebase-bom:34.19.0"))


        implementation("com.google.firebase:firebase-perf")
    }
}

apply from: 'capacitor.build.gradle'

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'