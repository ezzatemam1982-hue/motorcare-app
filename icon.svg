<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- خلفية بيضاء دائرية -->
  <rect width="512" height="512" rx="100" fill="#f8fafc"/>

  <!-- ============ الجزء العلوي: مفتاح ربط (wrench) ============ -->
  <!-- الجسم الرئيسي للمفتاح -->
  <g transform="translate(256, 155) rotate(-35)">
    <!-- عصا المفتاح -->
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="url(#wrenchGrad)"/>
    <!-- رأس المفتاح الأيسر (الدائرة) -->
    <circle cx="-95" cy="0" r="34" fill="url(#wrenchGrad)"/>
    <circle cx="-95" cy="0" r="18" fill="#e2e8f0"/>
    <!-- رأس المفتاح الأيمن (الشوكة) -->
    <rect x="68" y="-22" width="50" height="44" rx="6" fill="url(#wrenchGrad)"/>
    <rect x="76" y="-16" width="34" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="76" y="2" width="34" height="14" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- ============ جسم السيارة الرياضية ============ -->
  <!-- الهيكل الأساسي -->
  <path d="M55 330 C55 295, 90 270, 140 268 L370 265 C430 265, 465 290, 462 328 L470 360 C474 375, 460 385, 442 385 L72 385 C54 385, 40 375, 45 360 Z" fill="url(#carBodyGrad)"/>
  <!-- السقف والزجاج الأمامي -->
  <path d="M155 268 L185 210 L310 205 L360 268 Z" fill="url(#carTopGrad)" opacity="0.9"/>
  <!-- الزجاج الأمامي -->
  <path d="M185 268 L205 225 L290 220 L320 268 Z" fill="#60a5fa" opacity="0.7"/>
  <!-- باب السيارة / نافذة -->
  <path d="M220 268 L238 232 L295 228 L315 268 Z" fill="#93c5fd" opacity="0.55"/>

  <!-- خط وميض برتقالي/أحمر في منتصف السيارة (الشريط المميز) -->
  <path d="M78 335 L200 318 L420 315 L460 340 L420 345 L200 345 Z" fill="url(#flameGrad)" opacity="0.92"/>

  <!-- الإضاءة الأمامية -->
  <ellipse cx="68" cy="355" rx="18" ry="10" fill="#fef9c3" opacity="0.9"/>
  <ellipse cx="68" cy="355" rx="10" ry="6" fill="#fde047"/>
  <!-- الإضاءة الخلفية -->
  <ellipse cx="452" cy="355" rx="14" ry="8" fill="#fca5a5"/>
  <ellipse cx="452" cy="355" rx="8" ry="5" fill="#ef4444"/>

  <!-- ============ العجلات ============ -->
  <!-- عجلة أمامية -->
  <circle cx="168" cy="385" r="52" fill="#1e293b"/>
  <circle cx="168" cy="385" r="38" fill="#334155"/>
  <circle cx="168" cy="385" r="22" fill="#1e293b"/>
  <circle cx="168" cy="385" r="12" fill="#475569"/>
  <!-- أعمدة العجلة الأمامية (5 أعمدة) -->
  <line x1="168" y1="363" x2="168" y2="345" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="368" x2="196" y2="353" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="179" y1="383" x2="194" y2="383" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="151" y1="383" x2="142" y2="383" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="157" y1="368" x2="142" y2="354" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- إطار العجلة الأمامية -->
  <circle cx="168" cy="385" r="52" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- عجلة خلفية -->
  <circle cx="362" cy="385" r="52" fill="#1e293b"/>
  <circle cx="362" cy="385" r="38" fill="#334155"/>
  <circle cx="362" cy="385" r="22" fill="#1e293b"/>
  <circle cx="362" cy="385" r="12" fill="#475569"/>
  <!-- أعمدة العجلة الخلفية -->
  <line x1="362" y1="363" x2="362" y2="345" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="379" y1="368" x2="390" y2="353" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="373" y1="383" x2="388" y2="383" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="345" y1="383" x2="336" y2="383" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="351" y1="368" x2="336" y2="354" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- إطار العجلة الخلفية -->
  <circle cx="362" cy="385" r="52" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- ============ اسم التطبيق ============ -->
  <text x="256" y="466" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" text-anchor="middle" fill="url(#motorGrad)" letter-spacing="3">MOTOR</text>
  <text x="256" y="505" font-family="Arial Black, Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#careGrad)" letter-spacing="6">CARE</text>

  <!-- ============ التدرجات اللونية ============ -->
  <defs>
    <!-- تدرج جسم السيارة: أزرق غامق -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="60%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <!-- تدرج السقف -->
    <linearGradient id="carTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <!-- تدرج الشريط البرتقالي/الأحمر -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- تدرج المفتاح: رمادي فضي -->
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="30%" style="stop-color:#94a3b8"/>
      <stop offset="60%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <!-- تدرج MOTOR: أزرق -->
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <!-- تدرج CARE: برتقالي-أحمر -->
    <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
</svg>
