<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- الخلفية الداكنة الفخمة -->
  <rect width="512" height="512" rx="112" fill="#070a13"/>
  
  <!-- حرف M بتصميم هندسي ضخم وبارز في الخلفية يعطي هوية قوية -->
  <path d="M110 370 L110 140 L256 260 L402 140 L402 370" fill="none" stroke="#1e293b" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- سيارة أنيقة جداً ومنخفضة (Sports Silhouette) بلون أزرق ساطع -->
  <g transform="translate(0, 15)">
    <!-- الهيكل الانسيابي -->
    <path d="M130 250 C130 235, 160 215, 200 215 L312 215 C352 215, 382 235, 382 250 L395 285 C400 295, 390 305, 375 305 L137 305 C122 305, 112 295, 117 285 Z" fill="#2563eb"/>
    <!-- الزجاج الأمامي والخلفي بانسيابية عالية -->
    <path d="M180 215 L210 170 L302 170 L332 215 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- خط إضاءة ليد أمامي عصري -->
    <path d="M123 265 L133 265 L133 275 L123 275 Z" fill="#ffffff" rx="1"/>
    <!-- إضاءة خلفية -->
    <path d="M379 265 L389 265 L389 275 L379 275 Z" fill="#ef4444" rx="1"/>
    <!-- عجلات رياضية فخمة -->
    <circle cx="195" cy="305" r="28" fill="#070a13" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="195" cy="305" r="10" fill="#2563eb"/>
    <circle cx="317" cy="305" r="28" fill="#070a13" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="317" cy="305" r="10" fill="#2563eb"/>
  </g>

  <!-- اسم MotorCare بخط عصري ونظيف -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">Motor<tspan fill="#38bdf8">Care</tspan></text>
</svg>
